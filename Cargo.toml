[package]
name = "tuios"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/szymon-zygula/tuios"
description = "Terminal interface for grading in USOS course tests (Sprawdziany)"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
deunicode = "1.6.2"
dirs = "7.0.0"
hmac = "0.12"
nucleo-matcher = "0.3"
percent-encoding = "2.3.2"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "1.1.8"
